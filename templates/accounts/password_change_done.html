{% extends "app_base.html" %}

{% block title %}Password changed · {{ SITE_NAME }}{% endblock %}
{% block page_title %}Change Password{% endblock %}

{% block content %}
<div class="px-3 px-lg-4">
  <div class="row justify-content-center">
    <div class="col-lg-6">
      <div class="card">
        <div class="card-body text-center py-5">
          <span class="empty-icon" style="width:64px;height:64px;border-radius:50%;background:var(--success-soft);display:inline-flex;align-items:center;justify-content:center;font-size:1.6rem;color:var(--success);"><i class="bi bi-check-lg"></i></span>
          <h5 class="mt-3">Password changed successfully</h5>
          <p class="text-muted">Your password has been updated.</p>
          <a href="{% url 'dashboard' %}" class="btn btn-brand">Go to dashboard</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
