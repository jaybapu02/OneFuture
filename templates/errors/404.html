{% extends "base.html" %}
{% block title %}Page not found · {{ SITE_NAME }}{% endblock %}
{% block body %}
<div class="login-wrap">
  <div class="login-card">
    <div class="card">
      <div class="card-body text-center py-5 px-4">
        <div class="display-5 fw-bold" style="color:var(--brand);">404</div>
        <h5 class="mt-2">Page not found</h5>
        <p class="text-muted">The page you are looking for does not exist or has been moved.</p>
        <a href="{% url 'dashboard' %}" class="btn btn-brand">Back to dashboard</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
