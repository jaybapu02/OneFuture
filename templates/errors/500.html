{% extends "base.html" %}
{% block title %}Server error · {{ SITE_NAME }}{% endblock %}
{% block body %}
<div class="login-wrap">
  <div class="login-card">
    <div class="card">
      <div class="card-body text-center py-5 px-4">
        <div class="display-5 fw-bold" style="color:var(--danger);">500</div>
        <h5 class="mt-2">Something went wrong</h5>
        <p class="text-muted">An unexpected error occurred. Please try again in a moment.</p>
        <a href="{% url 'dashboard' %}" class="btn btn-brand">Back to dashboard</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
