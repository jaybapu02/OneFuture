{% if messages %}
<div class="toast-wrap" role="status" aria-live="polite">
  {% for message in messages %}
  {% with tag=message.tags|default:'info' %}
  <div class="app-toast app-toast--{{ tag }}" role="alert">
    <span class="toast-ic">
      {% if tag == 'success' %}<i class="bi bi-check-circle-fill"></i>
      {% elif tag == 'error' %}<i class="bi bi-exclamation-triangle-fill"></i>
      {% elif tag == 'warning' %}<i class="bi bi-exclamation-circle-fill"></i>
      {% else %}<i class="bi bi-info-circle-fill"></i>
      {% endif %}
    </span>
    <div class="toast-body">{{ message }}</div>
    <button type="button" class="toast-x" data-dismiss-toast aria-label="Dismiss"><i class="bi bi-x-lg"></i></button>
  </div>
  {% endwith %}
  {% endfor %}
</div>
{% endif %}
