{% if messages %}
<div class="px-3 px-lg-4 pt-3">
  {% for message in messages %}
  <div class="alert alert-{{ message.tags|default:'info' }} alert-auto alert-dismissible fade show border-0 shadow-sm" role="alert">
    {{ message }}
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
  </div>
  {% endfor %}
</div>
{% endif %}
