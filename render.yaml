# Render blueprint configuration (optional but recommended).
# The web service runs Gunicorn; the database is a separate PostgreSQL instance.

databases:
  - name: trainerhub-db
    plan: free
    databaseName: trainerhub

services:
  - type: web
    name: trainerhub
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /dashboard/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ${RENDER_EXTERNAL_URL}
      - key: CSRF_TRUSTED_ORIGINS
        value: ${RENDER_EXTERNAL_URL}
      - key: DATABASE_URL
        fromDatabase:
          name: trainerhub-db
          property: connectionString