# Render blueprint configuration.
# The web service runs Gunicorn; the database is a separate PostgreSQL instance.

databases:
  - name: onefuture-db
    plan: free
    databaseName: onefuture

services:
  - type: web
    name: onefuture
    runtime: python
    plan: free
    buildCommand: chmod +x ./build.sh && ./build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: SITE_NAME
        value: OneFuture
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ${RENDER_EXTERNAL_URL}
      - key: CSRF_TRUSTED_ORIGINS
        value: ${RENDER_EXTERNAL_URL}
      - key: TIME_ZONE
        value: Asia/Kolkata
      - key: DATABASE_URL
        fromDatabase:
          name: onefuture-db
          property: connectionString
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false